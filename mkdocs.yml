site_name: clearscale
site_url: https://clearscale.readthedocs.io/
site_description: Clear, dependency-free multiscale image metadata in Python
repo_url: https://github.com/ilastik/clearscale
repo_name: ilastik/clearscale

nav:
  - Home: index.md
  - OME-Zarr: ome_zarr.md
  - Basics: basics.md
  - Scaling methods: characterization.md
  - Coordinate systems: space.md
  - Scenes: scene.md
  - Examples: examples.md
  - API Reference:
      - Multiscale: reference/multiscale.md
      - Blueprints: reference/blueprints.md
      - Scenes: reference/scenes.md
      - OME-Zarr groups: reference/groups.md
      - Axis values: reference/axis-values.md
      - Affine transformations: reference/affines.md
      - Spatial relations: reference/spatial-relations.md
      - characterization: reference/characterization.md
      - ome_zarr: reference/ome_zarr.md
      - types: reference/types.md

plugins:
  - search
  - gh-admonitions
  - mkdocstrings:
      custom_templates: scripts/doc_templates
      handlers:
        python:
          paths: [src]
          options:
            filters: public
            inherited_members: true
            show_if_no_docstring: true
            merge_init_into_class: true
            show_submodules: false
            show_bases: false
            show_source: false
            show_root_heading: true
            heading_level: 2
            show_signature_annotations: true
            separate_signature: true
            docstring_style: null
