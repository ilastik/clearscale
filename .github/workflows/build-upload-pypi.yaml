name: Build and upload packages

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install build and validation tools
        run: python -m pip install build twine

      - name: Build binary wheel and source tarball
        run: python -m build

      - name: Check distribution metadata and README
        run: python -m twine check --strict dist/*

      - name: Smoke test the installed wheel
        run: |
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install --no-index --no-deps dist/*.whl
          "$RUNNER_TEMP/wheel-smoke/bin/python" -I .github/scripts/smoke_test_wheel.py "${GITHUB_REF_NAME#v}"

      - name: Store the distribution packages
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/


  publish-to-pypi:
    name: Publish to pypi
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: publish
      url: https://pypi.org/p/clearscale
    permissions:
      id-token: write
    needs: [ci, build]

    steps:
      - name: Download all the dists
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
