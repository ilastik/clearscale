version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    install:
      - python -m pip install ".[docs]"
    build:
      html:
        - python -m zensical build --clean --strict
    post_build:
      - mkdir -p "$READTHEDOCS_OUTPUT/html"
      - cp -R site/. "$READTHEDOCS_OUTPUT/html/"
