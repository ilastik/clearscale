[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "clearscale"
dynamic = ["version"]
authors = [
    {name = "Benedikt T. Best", email = "benedikt.best@embl.de"}
]
maintainers = [
    {name = "Benedikt T. Best", email = "benedikt.best@embl.de"},
    {name = "ilastik team", email = "team@ilastik.org"},
]
description = "Clear multiscale image metadata manipulation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE", "LICENSE-MIT", "LICENSE-APACHE"]
keywords = ["image-metadata", "multiscale", "ome-zarr", "ngff", "ome-ngff", "ngff-zarr", "precomputed"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Image Processing",
]

[project.urls]
Documentation = "https://clearscale.readthedocs.io/"
Source = "https://github.com/ilastik/clearscale"

[project.optional-dependencies]
dev = ["pre-commit", "pytest", "pyright"]
docs = ["zensical==0.0.74", "mkdocstrings-python==2.0.10"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/clearscale/_version.py"

[tool.hatch.build.targets.sdist]
exclude = ["/AGENTS.md", "/.github", "/tests"]

[tool.hatch.version.raw-options]
git_describe_command = [
    "git",
    "describe",
    "--dirty",
    "--tags",
    "--long",
    "--match",
    "v[0-9]*",
]

[tool.black]
line-length = 120
target-version = ["py311"]
